name: Sync Mihomo rules

on:
  schedule:
    # 每天北京时间 04:20 自动同步一次；GitHub Actions 使用 UTC 时间。
    - cron: "20 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync rules
        run: python sync-rules.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ruleset
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync mihomo rules"
            git push
          fi
